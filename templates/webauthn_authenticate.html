<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Fingerprint Authentication</title>
</head>

<body>

<h2>🔐 Fingerprint Authentication</h2>

<p>Student ID:</p>

<input
    type="text"
    id="studentId"
    placeholder="TEST001"
>

<br><br>

<button onclick="authenticateFingerprint()">
    👆 Authenticate Fingerprint
</button>

<p id="result">Ready...</p>


<script>

function bufferToBase64url(buffer) {

    const bytes = new Uint8Array(buffer);

    let binary = "";

    for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }

    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
}


function base64urlToBuffer(base64url) {

    const padding =
        "=".repeat(
            (4 - base64url.length % 4) % 4
        );

    const base64 =
        (base64url + padding)
        .replace(/-/g, "+")
        .replace(/_/g, "/");

    const binary = atob(base64);

    const bytes =
        new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] =
            binary.charCodeAt(i);
    }

    return bytes.buffer;
}


async function authenticateFingerprint() {

    const result =
        document.getElementById("result");

    const studentId =
        document.getElementById("studentId")
        .value
        .trim();


    if (!studentId) {

        result.innerText =
            "⚠️ Please enter Student ID.";

        return;
    }


    try {

        // -----------------------------------------
        // STEP 1
        // Ask Flask for authentication options
        // -----------------------------------------

        result.innerText =
            "⏳ Starting fingerprint authentication...";


        const startResponse =
            await fetch(
                "/authenticate/start",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        student_id: studentId
                    })
                }
            );


        const options =
            await startResponse.json();


        if (!startResponse.ok) {

            throw new Error(
                options.error ||
                "Authentication could not start."
            );
        }


        // -----------------------------------------
        // STEP 2
        // Convert challenge
        // -----------------------------------------

        options.challenge =
            base64urlToBuffer(
                options.challenge
            );

        if (options.allowCredentials) {

    options.allowCredentials =
        options.allowCredentials.map(function (credential) {

            credential.id =
                base64urlToBuffer(
                    credential.id
                );

            return credential;
        });
}


        // -----------------------------------------
        // STEP 3
        // Windows Hello fingerprint
        // -----------------------------------------

        result.innerText =
            "👆 Place your finger on the sensor...";


        const credential =
            await navigator.credentials.get({

                publicKey: options

            });


        if (!credential) {

            throw new Error(
                "No credential was received."
            );
        }


        // -----------------------------------------
        // STEP 4
        // Convert response to JSON
        // -----------------------------------------

        const credentialData = {

            id:
                credential.id,

            rawId:
                bufferToBase64url(
                    credential.rawId
                ),

            type:
                credential.type,

            response: {

                clientDataJSON:
                    bufferToBase64url(
                        credential.response
                            .clientDataJSON
                    ),

                authenticatorData:
                    bufferToBase64url(
                        credential.response
                            .authenticatorData
                    ),

                signature:
                    bufferToBase64url(
                        credential.response
                            .signature
                    ),

                userHandle:
                    credential.response.userHandle
                        ? bufferToBase64url(
                            credential.response.userHandle
                        )
                        : null
            }
        };


        // -----------------------------------------
        // STEP 5
        // Send response to Flask
        // -----------------------------------------

        result.innerText =
            "⏳ Verifying fingerprint...";


        const finishResponse =
            await fetch(
                "/authenticate/finish",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            credentialData
                        )
                }
            );


        const finishResult =
            await finishResponse.json();


        if (!finishResponse.ok ||
            !finishResult.verified) {

            throw new Error(
                finishResult.error ||
                "Fingerprint authentication failed."
            );
        }


        // -----------------------------------------
        // STEP 6
        // Successful authentication
        // -----------------------------------------

        result.innerText =
            "✅ Fingerprint authentication successful!";


        // Send result back to Streamlit

        const redirectUrl =
            "http://localhost:8501"
            + "?webauthn=success"
            + "&student_id="
            + encodeURIComponent(studentId);


        setTimeout(
            function () {

                window.location.href =
                    redirectUrl;

            },
            1000
        );

    }


    catch (error) {

        console.error(error);

        result.innerText =
            "❌ Error: "
            + error.name
            + " - "
            + error.message;
    }
}

</script>

</body>

</html>
