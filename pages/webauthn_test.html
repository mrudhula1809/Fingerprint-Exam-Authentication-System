<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fingerprint Registration Test</title>
</head>

<body>

<h1>🔐 Fingerprint Registration Test</h1>

<button onclick="registerFingerprint()">
    👆 Register Fingerprint
</button>

<p id="result">Ready...</p>

<script>

async function registerFingerprint() {

    const result = document.getElementById("result");

    try {

        result.innerText =
            "⏳ Starting Windows Hello...";

        // Create a random challenge
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);

        // Create a user ID
        const userId = new Uint8Array(16);
        crypto.getRandomValues(userId);

        const credential =
            await navigator.credentials.create({

                publicKey: {

                    challenge: challenge,

                    rp: {
                        name: "Fingerprint Examination System",
                        id: "localhost"
                    },

                    user: {
                        id: userId,
                        name: "TEST001",
                        displayName: "Test Student"
                    },

                    pubKeyCredParams: [
                        {
                            type: "public-key",
                            alg: -7
                        },
                        {
                            type: "public-key",
                            alg: -257
                        }
                    ],

                    authenticatorSelection: {

                        authenticatorAttachment: "platform",

                        userVerification: "required"
                    },

                    timeout: 60000,

                    attestation: "none"
                }

            });


        if (credential) {

            result.innerText =
                "🎉 SUCCESS! Windows Hello fingerprint was used!";

            console.log("Credential created:", credential);

        } else {

            result.innerText =
                "❌ No credential was created.";

        }

    }

    catch (error) {

        console.error(error);

        result.innerText =
            "❌ Error: " +
            error.name +
            " - " +
            error.message;
    }
}

</script>

</body>
</html>
